# CI/CD Pipeline for TaskAI (taskai.cc)
#
# TaskAI deploys by SSH'ing to the target server and building natively there
# (no Harbor registry). Tests run in parallel with staging deploy (fix-forward).
#
# Runners (org-level, biswas-dev):
#   ARM64: staging-arm64 (129.213.82.37), uat-arm64 (92.4.83.28)
#   x64:   prod-x64-1/2 (31.97.102.48)
#
# Flow:
#   main push       → test (Go + Node, parallel) + deploy staging
#   uat push        → deploy UAT
#   production push → deploy production
#   PR              → test only
#
# Required secrets (set in GitHub org/repo):
#   STAGING_SSH_KEY_BASE64 / UAT_SSH_KEY_BASE64 / PRODUCTION_SSH_KEY_BASE64
#   STAGING_DB_DSN, STAGING_JWT_SECRET, STAGING_LOGIN_GITHUB_CLIENT_ID, etc.
#   UAT_DB_DSN, UAT_JWT_SECRET, etc.
#   PRODUCTION_DB_DSN, PRODUCTION_JWT_SECRET, etc.
#   DD_API_KEY, DD_SITE

name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      quality_only:
        description: Run tests and publish reports without deploying applications
        type: boolean
        default: false
  push:
    branches: [main, uat, production]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── API Tests (Go) ─────────────────────────────────────────────────────
  test-api:
    permissions:
      contents: read
    name: "API Tests (Go)"
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64"]') }}
    # Every deployable branch is tested: the deploy jobs below need these.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/production'

    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: api/go.sum

      - name: Run Go vet
        working-directory: api
        run: go vet ./...

      - name: Run tests
        working-directory: api
        run: |
          go test -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /e2e)
          go tool cover -func=coverage.out | tail -1
        timeout-minutes: 10

      - name: Fetch verified report client
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS https://coverage.biswas.me/ci/report-v1.py -o "$RUNNER_TEMP/project-quality-report.py"
          echo "620701586b18553b55b6eb0bc964a7a0dcef82f04f989b9f010b18947ebc746a  $RUNNER_TEMP/project-quality-report.py" | sha256sum --check --status
      - name: Publish application coverage
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          COVERAGE_TOKEN: ${{ secrets.COVERAGE_TOKEN }}
          COVERAGE_REPO: taskai
          COVERAGE_GROUP: taskai
          COVERAGE_LANGUAGE: go
          COVERAGE_SOURCE_ROOT: 'api'
        run: |
          export COVERAGE_GO_MODULE=$(sed -n "s/^module //p" api/go.mod)
          python3 "$RUNNER_TEMP/project-quality-report.py" coverage api/coverage.out



  # ── MCP Tests (Go) ─────────────────────────────────────────────────────

      - name: Preserve application quality report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-coverage-application
          path: api/coverage.out
          if-no-files-found: error
          retention-days: 7

  test-mcp:
    permissions:
      contents: read
    name: "MCP Tests (Go)"
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64"]') }}
    # Every deployable branch is tested: the deploy jobs below need these.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/production'

    env:
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: mcp/go.sum

      - name: Run Go vet
        working-directory: mcp
        run: go vet ./...

      - name: Run tests
        working-directory: mcp
        run: go test -coverprofile=coverage.out -covermode=atomic -race ./...
        timeout-minutes: 5

      - name: Fetch verified report client
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS https://coverage.biswas.me/ci/report-v1.py -o "$RUNNER_TEMP/project-quality-report.py"
          echo "620701586b18553b55b6eb0bc964a7a0dcef82f04f989b9f010b18947ebc746a  $RUNNER_TEMP/project-quality-report.py" | sha256sum --check --status
      - name: Publish mcp coverage
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          COVERAGE_TOKEN: ${{ secrets.COVERAGE_MCP_TOKEN }}
          COVERAGE_REPO: taskai-mcp
          COVERAGE_GROUP: taskai
          COVERAGE_LANGUAGE: go
          COVERAGE_SOURCE_ROOT: 'mcp'
        run: |
          export COVERAGE_GO_MODULE=$(sed -n "s/^module //p" mcp/go.mod)
          python3 "$RUNNER_TEMP/project-quality-report.py" coverage mcp/coverage.out



  # ── Web Tests (Node) ───────────────────────────────────────────────────

      - name: Preserve mcp quality report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-coverage-mcp
          path: mcp/coverage.out
          if-no-files-found: error
          retention-days: 7

  test-web:
    permissions:
      contents: read
    name: "Web Tests"
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "Linux", "X64"]') }}
    # Every deployable branch is tested: the deploy jobs below need these.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives --max-warnings 5

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: web
        run: npx vitest run --coverage --coverage.reporter=lcov
        timeout-minutes: 10

      - name: Fetch verified report client
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsS https://coverage.biswas.me/ci/report-v1.py -o "$RUNNER_TEMP/project-quality-report.py"
          echo "620701586b18553b55b6eb0bc964a7a0dcef82f04f989b9f010b18947ebc746a  $RUNNER_TEMP/project-quality-report.py" | sha256sum --check --status
      - name: Publish web coverage
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          COVERAGE_TOKEN: ${{ secrets.COVERAGE_WEB_TOKEN }}
          COVERAGE_REPO: taskai-web
          COVERAGE_GROUP: taskai
          COVERAGE_LANGUAGE: node
          COVERAGE_SOURCE_ROOT: 'web'
        run: |
          python3 "$RUNNER_TEMP/project-quality-report.py" coverage web/coverage/lcov.info



  # ── Deploy Staging (builds on server via SSH, native ARM64) ────────────

      - name: Preserve web quality report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-coverage-web
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  deploy-staging:
    name: "Deploy to Staging"
    runs-on: [self-hosted, Linux, ARM64]
    # A deploy runs only once every test suite has passed for this commit.
    needs: [test-api, test-mcp, test-web]
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push') && inputs.quality_only != true && !contains(github.event.head_commit.message, '[quality only]')
    environment: staging

    env:
      STAGING_SSH_KEY_BASE64: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_DB_DSN: ${{ secrets.STAGING_DB_DSN }}
      STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      STAGING_LOGIN_GITHUB_CLIENT_ID: ${{ secrets.STAGING_LOGIN_GITHUB_CLIENT_ID }}
      STAGING_LOGIN_GITHUB_CLIENT_SECRET: ${{ secrets.STAGING_LOGIN_GITHUB_CLIENT_SECRET }}
      STAGING_OAUTH_STATE_SECRET: ${{ secrets.STAGING_OAUTH_STATE_SECRET }}
      STAGING_GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
      STAGING_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    steps:
      - uses: actions/checkout@v7

      - name: Deploy to staging
        run: bash deployment/scripts/travis-deploy-fast.sh staging


  # ── Deploy UAT ─────────────────────────────────────────────────────────
  deploy-uat:
    name: "Deploy to UAT"
    runs-on: [self-hosted, Linux, ARM64]
    # A deploy runs only once every test suite has passed for this commit.
    needs: [test-api, test-mcp, test-web]
    if: >-
      (github.ref == 'refs/heads/uat' && github.event_name == 'push') && inputs.quality_only != true && !contains(github.event.head_commit.message, '[quality only]')
    environment: uat

    env:
      UAT_SSH_KEY_BASE64: ${{ secrets.UAT_SSH_PRIVATE_KEY }}
      UAT_DB_DSN: ${{ secrets.UAT_DB_DSN }}
      UAT_JWT_SECRET: ${{ secrets.UAT_JWT_SECRET }}
      UAT_LOGIN_GITHUB_CLIENT_ID: ${{ secrets.UAT_LOGIN_GITHUB_CLIENT_ID }}
      UAT_LOGIN_GITHUB_CLIENT_SECRET: ${{ secrets.UAT_LOGIN_GITHUB_CLIENT_SECRET }}
      UAT_OAUTH_STATE_SECRET: ${{ secrets.UAT_OAUTH_STATE_SECRET }}
      UAT_GOOGLE_CLIENT_ID: ${{ secrets.UAT_GOOGLE_CLIENT_ID }}
      UAT_GOOGLE_CLIENT_SECRET: ${{ secrets.UAT_GOOGLE_CLIENT_SECRET }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    steps:
      - uses: actions/checkout@v7

      - name: Deploy to UAT
        run: bash deployment/scripts/travis-deploy-fast.sh uat


  # ── Deploy Production ──────────────────────────────────────────────────
  deploy-production:
    name: "Deploy to Production"
    runs-on: [self-hosted, Linux, X64, prod]
    # A deploy runs only once every test suite has passed for this commit.
    needs: [test-api, test-mcp, test-web]
    if: >-
      (github.ref == 'refs/heads/production' && github.event_name == 'push') && inputs.quality_only != true && !contains(github.event.head_commit.message, '[quality only]')
    environment: production

    env:
      PRODUCTION_SSH_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY }}
      PRODUCTION_DB_DSN: ${{ secrets.PRODUCTION_DB_DSN }}
      PRODUCTION_JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
      PRODUCTION_LOGIN_GITHUB_CLIENT_ID: ${{ secrets.PRODUCTION_LOGIN_GITHUB_CLIENT_ID }}
      PRODUCTION_LOGIN_GITHUB_CLIENT_SECRET: ${{ secrets.PRODUCTION_LOGIN_GITHUB_CLIENT_SECRET }}
      PRODUCTION_OAUTH_STATE_SECRET: ${{ secrets.PRODUCTION_OAUTH_STATE_SECRET }}
      PRODUCTION_GOOGLE_CLIENT_ID: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_ID }}
      PRODUCTION_GOOGLE_CLIENT_SECRET: ${{ secrets.PRODUCTION_GOOGLE_CLIENT_SECRET }}
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_SITE: ${{ secrets.DD_SITE }}

    steps:
      - uses: actions/checkout@v7

      - name: Deploy to production
        run: bash deployment/scripts/travis-deploy-fast.sh production
